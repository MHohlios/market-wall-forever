name: Release

# Publishing a GitHub release builds the addon and uploads it to CurseForge, with the
# release's text as the file's changelog. A bare tag push builds nothing.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The release event's ref is the release's tag, so this checks out the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the release text to CHANGELOG.md
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [[ -z "${RELEASE_BODY//[[:space:]]/}" ]]; then
            echo "::error::The release has no text. Add release notes, since they become the CurseForge changelog."
            exit 1
          fi
          printf '%s' "$RELEASE_BODY" > CHANGELOG.md
      # No GitHub token: the packager's GitHub upload would rewrite the release's name,
      # text and pre-release flag, so it uploads to CurseForge only.
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
