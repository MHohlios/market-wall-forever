name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the packager creates the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CHANGELOG.md has the tag's heading
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh check "$TAG"
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
