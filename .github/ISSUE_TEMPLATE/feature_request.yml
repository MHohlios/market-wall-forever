name: Feature request
description: Suggest something MarketWall could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or task, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: |
        Your idea, if you have one. Every auction search, buy or post needs the player's
        own key press, and MarketWall never automates or queues them.
